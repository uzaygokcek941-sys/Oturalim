<style>
  .by-bas{display:flex;align-items:flex-start;justify-content:space-between;
          gap:var(--a4);flex-wrap:wrap;margin:var(--a5) 0}
  .by-bas h1{font-size:1.9rem;margin:0 0 var(--a2)}
  .by-bas p{margin:0;color:var(--soluk)}

  /* Sayilar: bayinin panele bakma sebebi bu satir. */
  .by-sayilar{display:grid;gap:var(--a3);margin:0 0 var(--a5);padding:0;
              list-style:none;
              grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr))}
  .by-sayilar li{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
                 padding:var(--a4)}
  .by-sayilar b{display:block;font-size:1.5rem;font-weight:650;line-height:1.15;
                font-variant-numeric:tabular-nums}
  .by-sayilar span{display:block;font-size:.85rem;color:var(--soluk);
                   margin-top:2px}
  .by-sayilar li.vurgu{border-color:var(--vurgu)}

  .by-bolum{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
            padding:var(--a5);margin-bottom:var(--a5)}
  .by-bolum h2{font-size:1.1rem;margin:0 0 var(--a3)}
  .by-bolum p{margin:0 0 var(--a3);color:var(--soluk);line-height:1.6}
  .by-bolum p:last-child{margin-bottom:0}

  .by-bolge{display:flex;flex-wrap:wrap;gap:var(--a2);margin:0;padding:0;
            list-style:none}

  /* Genis tablo KENDI icinde kayiyor; sayfa govdesi yana kaymiyor. */
  .by-kaydir{overflow-x:auto;margin:0 calc(var(--a5) * -1) calc(var(--a5) * -1);
             padding:0 var(--a5) var(--a5)}
  .by-tablo{width:100%;border-collapse:collapse;font-size:.92rem;
            min-width:34rem}
  .by-tablo th,.by-tablo td{text-align:left;padding:var(--a2) var(--a3);
                            border-top:1px solid var(--cizgi);
                            vertical-align:top}
  .by-tablo th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;
               color:var(--soluk);font-weight:600;border-top:0}
  .by-tablo td.sayi{font-variant-numeric:tabular-nums;white-space:nowrap}
  .by-tablo a{color:inherit}

  .by-not{font-size:.86rem;color:var(--soluk);margin-top:var(--a3);
          line-height:1.6}
  .by-bos{text-align:center;padding:var(--a6) var(--a4);color:var(--soluk);
          line-height:1.65}
  .by-bos strong{display:block;color:var(--metin);font-size:1.15rem;
                 margin-bottom:var(--a2)}
  .uyari{display:none;gap:var(--a3);padding:var(--a4);border-radius:var(--r,10px);
    font-size:13px;line-height:1.55;margin-bottom:var(--a4);align-items:flex-start}
  .uyari.gorunur{display:flex}
  .uyari.hata{background:color-mix(in srgb,var(--kirmizi) 14%,transparent);
    border:1px solid var(--kirmizi);color:var(--metin)}

<script type="module">
import Kimlik from "./kimlik.js";

/* ============================================================
   Bayi paneli

   NEDEN AYRI BIR SAYFA. isletmem.html işletme sahibinin ekranı:
   "sayfamı kaç kişi gördü, neyim eksik". Bayinin sorduğu soru bambaşka:
   "dağıttığım kartların kaçı çalıştı, ne kadar hakedişim var". İkisini
   tek ekranda toplamak iki kullanıcıya da yarım cevap vermek olurdu --
   aynı gerekçeyle isletmem.html de hesabim.html'den ayrılmıştı.

   BU SAYFA HİÇBİR ŞEY YAZMIYOR. Bayilik verilen bir şey, alınan değil:
   bayi kaydını, bölgeyi ve ücreti yönetici giriyor (bayilik.sql'de
   insert/update politikaları yalnız yoneticide). Panelin tek işi
   göstermek. Bu yüzden sayfada tek bir form yok.

   KİMLİK GÖRÜNMÜYOR. Kartın sahiplenilip sahiplenilmediği görünüyor,
   kimin sahiplendiği görünmüyor -- fonksiyon o sütunu hiç döndürmüyor
   (bayilik.sql, bayi_kartlarim). Bayi kendi bölgesindeki işletmecilerin
   listesini eline geçirebilseydi kart bir tanışma aracı değil bir
   müşteri listesi olurdu.
   ============================================================ */

const el = s => document.querySelector(s);

function uyar(tur, metin){
  const k = el("#uyari");
  k.className = "uyari" + (metin ? " gorunur " + tur : "");
  el("#uyari-metin").textContent = metin || "";
}

function tarihTR(t){
  if (!t) return "";
  const d = new Date(t);
  return isNaN(d) ? "" : d.toLocaleDateString("tr-TR",
    { day: "numeric", month: "short", year: "numeric" });
}

function bolgeYazisi(liste){
  const aktif = liste.filter(b => b.durum === "aktif");
  if (!aktif.length) return "";
  return aktif.map(b => b.ilce + " (" + b.il + ")").join(", ");
}

function ozetKutulari(o){
  /* Sıfır burada GÖSTERİLİYOR ve isletmem.html'in tersi bir karar.
     Orada "0 kişi baktı" cesaret kırıcıydı ve "sayaç çalışmıyor" ile
     ayırt edilemiyordu. Burada sıfır bir ölçüm: "20 kart bıraktım,
     0'ı sahiplenildi" bayinin bilmesi gereken en önemli cümle. */
  return '<ul class="by-sayilar">' +
    '<li><b>' + sayi(o.kart) + "</b><span>basılan kart</span></li>" +
    '<li><b>' + sayi(o.sahiplenilen) + "</b><span>sahiplenildi</span></li>" +
    '<li><b>' + sayi(o.alanEklenen) + "</b><span>bilgi ekledi</span></li>" +
    '<li><b>' + kurus(o.hakedis) + "</b><span>hakediş</span></li>" +
    '<li><b>' + kurus(o.odenen) + "</b><span>ödenen</span></li>" +
    '<li class="vurgu"><b>' + kurus(o.bakiye) + "</b><span>bakiye</span></li>" +
    "</ul>";
}

function kartTablosu(liste){
  if (!liste.length){
    return '<div class="by-bolum"><h2>Kartlarım</h2>' +
      '<p>Adına basılmış kart yok. Kartlar bölge belli olduktan sonra ' +
      "basılıyor; parti hazır olduğunda burada görünür.</p></div>";
  }
  const satir = k => {
    const sayfa = k.il && k.mekanId
      ? "isletme.html?il=" + encodeURIComponent(k.il) +
        "&id=" + encodeURIComponent(k.mekanId)
      : null;
    return "<tr>" +
      "<td>" + (sayfa ? '<a href="' + kacir(sayfa) + '">' + kacir(k.mekanAd) + "</a>"
                      : kacir(k.mekanAd)) + "</td>" +
      "<td>" + kacir(k.parti || "—") + "</td>" +
      '<td class="sayi">' + kacir(tarihTR(k.basildi)) + "</td>" +
      '<td class="sayi">' + (k.sahiplenildi ? kacir(tarihTR(k.sahiplenildi)) : "—") + "</td>" +
      '<td class="sayi">' + (k.alanEklendi ? "evet" : "—") + "</td>" +
      "</tr>";
  };
  return '<div class="by-bolum"><h2>Kartlarım</h2>' +
    '<div class="by-kaydir"><table class="by-tablo">' +
    "<thead><tr><th>İşletme</th><th>Parti</th><th>Basıldı</th>" +
    "<th>Sahiplenildi</th><th>Bilgi ekledi</th></tr></thead><tbody>" +
    liste.map(satir).join("") + "</tbody></table></div>" +
    '<p class="by-not">Bir kart en çok bir kez sahiplenilir ve mekan başına ' +
    "hakediş bir kez doğar — işletmenin on alan doldurması on hakediş değil. " +
    "Sahiplenen kişinin kim olduğu bu panelde <strong>görünmüyor</strong>.</p>" +
    "</div>";
}

function bayiDegilEkrani(){
  return '<div class="by-bos">' +
    "<strong>Bu hesap bir bayiye bağlı değil</strong>" +
    "Bayi, bir ilçenin saha temsilcisi: o bölgenin işletmelerine kart " +
    "bırakıyor ve işletme sayfasını sahiplenip bilgisini doldurduğunda " +
    "hakediş kazanıyor. Hakediş kartın kendisinden doğuyor — kimse " +
    "&#34;şu kadar yere uğradım&#34; demiyor." +
    '<p style="margin-top:var(--a4)">Bölge almak için gizlilik ' +
    'sayfasındaki adresten bize yaz.</p>' +
    '<a class="dugme ikincil" style="margin-top:var(--a3)" href="gizlilik.html">' +
    "İletişim</a></div>";
}

async function ciz(){
  const yuva = el("#govde");
  yuva.textContent = "Yükleniyor…";

  const bayi = await Kimlik.bayiMiyim();
  if (!bayi){
    el("#ustyazi").textContent = "Bayilik tanımlı değil.";
    yuva.innerHTML = bayiDegilEkrani();
    return;
  }

  let ozet = null, kartlar = [], bolgeler = [];
  try {
    [ozet, kartlar, bolgeler] = await Promise.all([
      Kimlik.bayiOzetim(),
      Kimlik.bayiKartlarim(500),
      Kimlik.bayiBolgelerim()
    ]);
  } catch (e){
    /* Panel BOŞ EKRAN göstermiyor: veri gelmediyse sebebi yazıyor.
       Sessiz boş panel, "hakedişim silinmiş" diye okunur. */
    el("#ustyazi").textContent = "Panel yüklenemedi.";
    yuva.innerHTML = '<div class="by-bos"><strong>Veriler gelmedi</strong>' +
      kacir(e.message) + "</div>";
    return;
  }

  const bolge = bolgeYazisi(bolgeler);
  el("#ustyazi").textContent = bolge
    ? "Bölgen: " + bolge
    : "Henüz bölge tanımlanmadı.";

  yuva.innerHTML =
    (ozet ? ozetKutulari(ozet) : "") +
    kartTablosu(kartlar) +
    '<div class="by-bolum"><h2>Hakediş nasıl hesaplanıyor</h2>' +
    "<p>İki aşama var. <strong>Sahiplenme</strong>: işletme kartındaki " +
    "kodu girip sayfasını sahiplendi — kart çalıştı. <strong>Bilgi</strong>: " +
    "işletme gerçekten saat, telefon, adres ya da site bilgisi ekledi ve " +
    "bilgi yayına çıktı — kart işe yaradı.</p>" +
    "<p>Ücret hakediş anında donuyor: oran sonradan değişirse geçmiş " +
    "kazanımlar değişmiyor. Ödeme bu panelin dışında yapılıyor; buradaki " +
    "<strong>bakiye</strong> hakediş eksi ödenen.</p></div>";
}

(async () => {
  let hazir = false;
  try { hazir = await Kimlik.hazir; } catch (e) { hazir = false; }
  if (!hazir || !Kimlik.girisli){
    /* Girişsiz kullanıcı boş ekran görmesin, nereye gideceğini söyleyen
       bir yere gitsin. replace: geri tuşu buraya döndürmesin. */
    /* ?donus= ile: giris.html bu parametreyi destekliyor ve degeri
       ortak.js'teki guvenliDonus() denetliyor (javascript:, data:, dis
       site ve ust klasor hepsi DUSUYOR -- kendi test tablosu var).
       Ilk yazimda "?sonra=" aramistim, bulamayinca duz giris.html
       birakmistim: yanlis parametre ADI yuzunden calisan bir ozelligi
       yok saymisim. Sonucu somut -- bayi giris yapip hesabim.html'e
       dusuyor ve panele elle donmesi gerekiyordu.
       replace: geri tusu buraya dondurmesin. */
    location.replace("giris.html?donus=" + encodeURIComponent("bayi.html"));
    return;
  }
  try { await ciz(); }
  catch (e){ uyar("hata", e.message || "Panel açılamadı."); }
})();
</script>
