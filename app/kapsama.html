  /* Alan cubugu: renk TEK BASINA bilgi tasimiyor, sayi da yaninda. */

  .kp-alan li{display:grid;grid-template-columns:8.5rem 1fr auto;

  .kp-alan li:first-child{border-top:0}
  .kp-alan .cubuk{height:8px;border-radius:4px;background:var(--cizgi);
                  overflow:hidden}
  .kp-alan .cubuk i{display:block;height:100%;background:var(--vurgu)}
  .kp-alan .oran{font-variant-numeric:tabular-nums;color:var(--soluk);

  .kp-kaydir{overflow-x:auto;margin:0 calc(var(--a5) * -1);

  .kp-daha{margin-top:var(--a4)}
  .kp-not{font-size:.86rem;color:var(--soluk);line-height:1.6;

<script>
/* ============================================================
   Kapsama — kötü sayıyı kendimiz yayınlıyoruz

   NEDEN VAR. Bu sektörde kimse kendi kapsamasını yayınlamıyor: Google
   Maps de, Yemeksepeti de "kaç mekanın fiyatını bilmiyoruz" demiyor.
   İki faydası var, ikisi de somut:
     (a) "Uygulamanız boş" itirazını önce biz söylersek, itiraz olmaktan
         çıkıp yöntem oluyor.
     (b) Deponun kendi kuralı burada da geçerli: *yanlış fiyat,
         fiyatsızlıktan kötüdür.* Bunun kapsama karşılığı, büyük sayıyı
         (35.852) küçük sayının (293) önüne koymamak.

   HİÇBİR SAYI ELLE YAZILMIYOR. Hepsi kapsama.json'dan geliyor, o da
   kapsama_uret.py ile app/veri/*.json'dan sayılıyor. Ölçüldü ve
   yaşandı: keşfet sayfası bir dönem iki yerde BAYAT bir mekan sayısı
   gösteriyordu ve aylarca kimse görmedi. Elle yazılan her rakam eskiyor.

   Bu yorumda o eski rakamı YAZMIYORUM ve sebebi somut: veri_tutarli_mi()
   sayfa metninde bayat mekan sayısını arıyor ve yorumu gövdeden
   ayırmıyor. Ayırması da gerekmez -- o rakamın bir sayfada geçiyor
   olması tek başına yeterli sebep.

   MODÜL DEĞİL, DÜZ BETİK: bu sayfanın Supabase'e ihtiyacı yok. Giriş
   yapmamış bir ziyaretçi de görebilmeli ve kimlik katmanını beklemek
   sayfayı yavaşlatmaktan başka bir şey yapmaz.
   ============================================================ */
(function(){
  var el = function(s){ return document.querySelector(s); };

  function yuzde(n, t){ return t ? (100 * n / t) : 0; }
  function yuzdeYaz(n, t){
    var o = yuzde(n, t);
    /* İki basamak ancak %10'un altında anlamlı: "%0,82" bir bilgi,
       "%83,70" gürültü. */
    return "%" + (o < 10 ? o.toFixed(2) : o.toFixed(1)).replace(".", ",");
  }

  function sayilar(v){
    return '<ul class="kp-sayilar">' +
      "<li><b>" + sayi(v.il) + "</b><span>il</span></li>" +
      "<li><b>" + sayi(v.mekan) + "</b><span>mekan haritada</span></li>" +
      '<li class="kotu"><b>' + sayi(v.menulu) + "</b><span>menüsü ölçülmüş mekan · " +
        yuzdeYaz(v.menulu, v.mekan) + "</span></li>" +
      '<li class="kotu"><b>' + sayi(v.menuluMarka) + "</b><span>bu mekanların arkasındaki " +
        "farklı işletme</span></li>" +
      '<li class="kotu"><b>' + sayi(v.menusuzIl) + "</b><span>ilde tek bir menü yok</span></li>" +
      "<li><b>" + sayi(v.ulasilamaz) + "</b><span>mekanda ne telefon, ne web, " +
        "ne Instagram · " + yuzdeYaz(v.ulasilamaz, v.mekan) + "</span></li>" +
      "</ul>";
  }

  function alanlar(v){
    return '<div class="kp-bolum"><h2>Hangi bilgi ne kadar dolu</h2>' +
      '<ul class="kp-alan">' + v.alanlar.map(function(a){
        var o = yuzde(a.mekan, v.mekan);
        return "<li><span>" + kacir(a.ad) + "</span>" +
          '<span class="cubuk"><i style="width:' + o.toFixed(2) + '%"></i></span>' +
          '<span class="oran">' + sayi(a.mekan) + " · " +
          yuzdeYaz(a.mekan, v.mekan) + "</span></li>";
      }).join("") + "</ul></div>";
  }

  function iller(v){
    /* İlk 15 açık, kalanı düğmeyle. 81 satırı birden açmak sayfanın
       söylediği şeyi (ilk satırda bile oran düşük) gömerdi. */
    var satir = function(i){
      return '<tr' + (i.menu ? "" : ' class="bos"') + "><td>" + kacir(i.ad) + "</td>" +
        '<td class="sayi">' + sayi(i.mekan) + "</td>" +
        '<td class="sayi">' + (i.menu || "—") + "</td>" +
        '<td class="sayi">' + (i.menu ? yuzdeYaz(i.menu, i.mekan) : "—") + "</td></tr>";
    };
    return '<div class="kp-bolum"><h2>İl il</h2>' +
      "<p>En dolu il en üstte. <strong>Alfabetik değil</strong> — alfabetik " +
      "olsaydı bu tablonun söylediği şey kaybolurdu.</p>" +
      '<div class="kp-kaydir"><table class="kp-tablo">' +
      "<thead><tr><th>İl</th><th>Mekan</th><th>Menü</th><th>Oran</th></tr></thead>" +
      /* IKI AYRI <tbody>, ic ice DEGIL. Ilk yazimda ic ice yazmisim;
         tarayici onu kendiliginden duzeltir ama duzeltirken hidden
         tasiyan dugumu baska yere koyabilir -- yani "kalani goster"
         dugmesi sessizce calismayabilirdi. */
      "<tbody>" + v.iller.slice(0, 15).map(satir).join("") + "</tbody>" +
      '<tbody id="kalan" hidden>' + v.iller.slice(15).map(satir).join("") +
      "</tbody></table></div>" +
      '<button class="dugme ikincil kp-daha" type="button" id="daha">' +
      "Kalan " + (v.iller.length - 15) + " ili göster</button></div>";
  }

  function ciz(v){
    el("#tez").innerHTML =
      "Haritada <strong>" + sayi(v.mekan) + " mekan</strong> var. " +
      "Menüsü ölçülmüş olan <strong>" + sayi(v.menulu) + "</strong> — " +
      "yani <strong>" + yuzdeYaz(v.menulu, v.mekan) + "</strong>. " +
      "Bunu büyütmenin tek yolu sensin.";

    var g = el("#govde");
    g.className = "";
    g.innerHTML =
      sayilar(v) +

      '<div class="kp-bolum"><h2>Neden 293 mekan ama 93 işletme</h2>' +
      "<p>Menüsü ölçülmüş " + sayi(v.menulu) + " mekanın arkasında " +
      "<strong>" + sayi(v.menuluMarka) + " farklı işletme</strong> var. " +
      "Aradaki fark zincir şubeleri: bir zincirin menüsü bir kez " +
      "ölçülüyor, bütün şubelerine yazılıyor.</p>" +
      "<p><strong>" + sayi(v.menulu) + " diye tek bir sayı yazsaydık " +
      "bunu saklamış olurduk.</strong> İkisini yan yana koyuyoruz çünkü " +
      "asıl iş ikincisini büyütmek.</p></div>" +

      alanlar(v) +
      iller(v) +

      '<div class="kp-bolum"><h2>Neden bu kadar boş</h2>' +
      "<p>Mekanların yeri ve adı OpenStreetMap'ten geliyor; orada fiyat " +
      "yok. Fiyatı toplamanın üç yolu var ve üçü de yavaş: işletmenin " +
      "kendi sitesi, işletmenin kendisi, ve orada oturan kullanıcı.</p>" +
      "<p><strong>" + sayi(v.ulasilamaz) + " mekanda ne telefon, ne web, " +
      "ne sosyal medya hesabı var.</strong> O işletmelere uzaktan " +
      "ulaşmanın yolu yok — kapılarına gitmek gerekiyor.</p>" +
      "<p>Google Maps, Yandex, Yemeksepeti, Getir ve TrendyolGo " +
      "verisini <strong>kazımıyoruz</strong>. Telif gerekçesiyle " +
      "reddedildi ve bu karar koda da yazılı. Boş kalan yer bunun " +
      "bedeli.</p></div>" +

      '<div class="kp-bolum"><h2>Bu sayfa nasıl üretiliyor</h2>' +
      "<p>Buradaki hiçbir rakam elle yazılmadı. Hepsi il dosyalarından " +
      "sayılıyor ve her veri turundan sonra yeniden üretiliyor. Bu " +
      "sayfanın kendisi de bir kontrolle bağlı: üretilen sayılar veriyle " +
      "tutmuyorsa yayına çıkamıyor.</p>" +
      '<p><a href="hakkinda.html">Verinin nereden geldiği</a> · ' +
      '<a href="gizlilik.html">Gizlilik</a></p></div>';

    var d = document.getElementById("daha");
    if (d) d.addEventListener("click", function(){
      document.getElementById("kalan").hidden = false;
      d.remove();
    });
  }

  fetch("kapsama.json")
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(ciz)
    .catch(function(){
      /* SAYI UYDURULMUYOR. Dosya gelmediyse sayfa boş kalır ve sebebini
         söyler; yaklaşık bir rakam yazmak bu sayfanın bütün amacını
         bozardı. */
      el("#tez").textContent = "Kapsama sayıları şu an yüklenemedi.";
      el("#govde").textContent =
        "Sayfayı yenilemeyi dene. Buradaki sayılar veriden üretiliyor; " +
        "yaklaşık bir rakam göstermiyoruz.";
    });
})();
</script>
