<script type="module">
import Kimlik from "./kimlik.js";

/* ============================================================
   İşletme paneli

   NEDEN AYRI BIR SAYFA: hesabim.html müşterinin ekranı — favoriler,
   paylaşımlar, yorumlar. İşletme sahibinin sorduğu soru bambaşka:
   "sayfamı kaç kişi gördü, neyim eksik, telefonu nasıl düzeltirim".
   İkisini tek ekranda toplamak, iki kullanıcıya da yarım cevap
   vermek olurdu.

   NEDEN AYRI PAROLA SISTEMI DEĞİL: sahiplik, hangi formdan girdiğinle
   değil **elden verilen kodla** kanıtlanıyor (`sahiplenme.sql`). İkinci
   bir kimlik deposu — ikinci parola, ikinci sıfırlama, ikinci oturum —
   kimin neyi yapabildiği konusunda hiçbir şeyi değiştirmez, yalnız
   saldırı yüzeyini büyütür. Yetkiyi burada da RLS belirliyor; bu sayfa
   yalnız arayüzü sürüyor.

   VERI KATMANI ZATEN HAZIRDI: `sahipliklerim`, `mekanSayaci`,
   `katkiGonder` (sahibin katkısı `sahip_katkisi_onayli` tetikleyicisiyle
   doğrudan yayına çıkıyor), `mekanPuani`, `fisOzeti`. Yeni SQL yazılmadı.
   ============================================================ */

const el = s => document.querySelector(s);

/* Sahibin değiştirebildiği alanlar. Liste ortak.js'te (KATKI_ALAN) ve
   doğrulama da orada (katkiSorunu) -- işletme sayfasıyla aynı kural,
   iki yerde iki türlü olmasın. Kod bu listeyi TÜRETİYOR, kopyalamıyor. */
const ALANLAR = Object.keys(KATKI_ALAN);

function uyar(tur, metin){
  const k = el("#uyari");
  k.className = "uyari" + (metin ? " gorunur " + tur : "");
  el("#uyari-metin").textContent = metin || "";
}

function tarihTR(t){
  if (!t) return "";
  const d = new Date(t);
  return isNaN(d) ? "" : d.toLocaleDateString("tr-TR",
    { day: "numeric", month: "long", year: "numeric" });
}

/* Mekanın kendi verisi (il dosyasından) — hangi alanların dolu olduğunu
   görmek için. Il dosyaları büyük; aynı il iki kez indirilmesin. */
const ilOnbellek = new Map();
async function mekaniGetir(il, mekanId){
  if (!il || !mekanId) return null;
  if (!ilOnbellek.has(il)){
    ilOnbellek.set(il, fetch("veri/" + encodeURIComponent(il) + ".json")
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      /* Dosya sıkıştırılmış biçimde (veri_bicim.py); çözücü ortak.js'te
         ve üç tüketici de aynı fonksiyonu çağırıyor. */
      .then(ham => ilCoz(ham).mekanlar)
      .catch(() => []));
  }
  const liste = await ilOnbellek.get(il);
  return liste.find(m => m.id === mekanId) || null;
}

function eksikSatirlari(m){
  if (!m) return [];
  return ALANLAR.filter(a => !m[a]);
}

async function mekanKutusu(o){
  const kap = document.createElement("section");
  kap.className = "im-mekan";
  const aktif = o.durum === "aktif";
  const sayfa = o.il && o.mekan_id
    ? "isletme.html?il=" + encodeURIComponent(o.il) + "&id=" + encodeURIComponent(o.mekan_id)
    : null;

  kap.innerHTML =
    "<header><h2>" +
      (sayfa ? '<a href="' + kacir(sayfa) + '">' + kacir(o.mekan_ad) + "</a>"
             : kacir(o.mekan_ad)) + "</h2>" +
    '<span class="rozet ' + (aktif ? "acik" : "kapali") + '">' +
      (aktif ? "doğrulanmış"
             : o.durum === "birakildi" ? "bıraktın" : "iptal edildi") +
    "</span></header>" +
    '<div data-sayilar></div><div data-govde></div>';

  const sayilar = kap.querySelector("[data-sayilar]");
  const govde = kap.querySelector("[data-govde]");

  if (!aktif){
    govde.innerHTML = '<p class="im-not">' +
      (o.durum === "birakildi"
        ? "Bu işletmenin sahipliğini bıraktın. Kartındaki kod tek kullanımlık; "
          + "yeniden sahiplenmek için bize yaz."
        : "Bu sahiplik geri alındı. Sebebini öğrenmek için gizlilik "
          + "sayfasındaki adresten bize yazabilirsin.") + "</p>";
    return kap;
  }

  /* --- sayılar --- */
  const [sayac, puan, fis, mekan] = await Promise.all([
    Kimlik.mekanSayaci(o.mekan_id).catch(() => null),
    Kimlik.mekanPuani(o.mekan_id).catch(() => null),
    Kimlik.fisOzeti(o.mekan_id).catch(() => null),
    mekaniGetir(o.il, o.mekan_id)
  ]);

  const kutular = [];
  /* Sıfır GÖSTERİLMİYOR: "0 kişi baktı" hem cesaret kırıcı hem de
     "sayaç çalışmıyor" ile ayırt edilemiyor. Aynı karar isletme.html'de
     de alınmıştı. */
  if (sayac && sayac.son30)
    kutular.push("<b>" + sayi(sayac.son30) + "</b><span>son 30 günde baktı" +
                 (sayac.bugun ? " · bugün " + sayi(sayac.bugun) : "") + "</span>");
  /* `ortalama` null olabiliyor (fonksiyon adet ile ortalamayi ayri
     donduruyor). null uzerinde toLocaleString cagirmak sayfayi
     patlatirdi -- adet kontrolu tek basina yetmez. */
  if (puan && puan.adet >= YORUM_ESIK && puan.ortalama != null)
    kutular.push("<b>" + puan.ortalama.toLocaleString("tr-TR") + "</b><span>" +
                 sayi(puan.adet) + " yorumun ortalaması</span>");
  /* Fiş eşiği burada da geçerli: kural ortak.js'te (fisGoster), üç ekran
     da ona soruyor. Sahibi olman eşiği gevşetmiyor -- eşik k-anonimlik
     için ve fişi yazan kişi senin müşterin. */
  if (fisGoster(fis))
    kutular.push("<b>" + tl(fis.medyan) + "</b><span>kişi başı, " +
                 sayi(fis.fis) + " fişten</span>");

  sayilar.innerHTML = kutular.length
    ? '<div class="im-sayilar">' + kutular.map(k => "<div>" + k + "</div>").join("") + "</div>"
    : '<p class="im-not">Henüz gösterilecek bir sayı yok. ' +
      "Sayfan görüldükçe burada belirecek.</p>";

  /* --- eksikler --- */
  const eksik = eksikSatirlari(mekan);
  let ic = "";
  if (!mekan){
    ic += '<p class="im-not">Mekan bilgisi yüklenemedi; aşağıdaki formu ' +
          "yine de kullanabilirsin.</p>";
  } else if (eksik.length){
    ic += '<ul class="im-eksik">' + eksik.map(a =>
      "<li><b>" + kacir(KATKI_ALAN[a]) + "</b><span>bu bilgi sayfanda yok</span></li>"
    ).join("") + "</ul>";
  } else {
    ic += '<p class="im-not iyi">Sayfanda eksik bir bilgi görünmüyor.</p>';
  }

  /* --- düzenleme formu --- */
  ic += '<form class="im-form"><div class="im-satir">' +
    '<select aria-label="Hangi bilgiyi güncelliyorsun">' +
    ALANLAR.map(a => '<option value="' + kacir(a) + '"' +
      (eksik[0] === a ? " selected" : "") + ">" +
      kacir(KATKI_ALAN[a]) + "</option>").join("") +
    "</select>" +
    '<input type="text" maxlength="200" placeholder="Yeni değer" ' +
    'aria-label="Yeni değer" required>' +
    '<button class="dugme" type="submit">Kaydet</button>' +
    "</div>" +
    '<p class="im-not">Doğrulanmış işletmede bu dört bilgi <strong>sıraya ' +
    "girmeden</strong> yayına çıkar. Fiyat bunun dışında: fiyat paylaşımı " +
    "herkes için aynı kontrolden geçiyor.</p></form>" +
    '<div class="im-islem">' +
    (sayfa ? '<a class="dugme ikincil" href="' + kacir(sayfa) + '">Sayfayı gör</a>' : "") +
    '<button class="dugme duz" type="button" data-birak="' + o.id + '">' +
    "Sahipliği bırak</button></div>";
  govde.innerHTML = ic;

  /* --- olaylar --- */
  const form = govde.querySelector("form");
  const not = form.querySelector(".im-not");
  form.addEventListener("submit", async olay => {
    olay.preventDefault();
    const alan = form.querySelector("select").value;
    const girdi = form.querySelector("input");
    const deger = girdi.value.trim();
    /* Doğrulama ortak.js'te (katkiSorunu): işletme sayfası, yönetim
       ekranı ve burası aynı kuralı kullanıyor. Kendi kuralımı yazsaydım
       "burada kabul edilen, orada reddedilen" bir değer olurdu. */
    const sorun = katkiSorunu(alan, deger);
    if (sorun){ not.className = "im-not kotu"; not.textContent = sorun; return; }
    const dug = form.querySelector("button");
    dug.disabled = true;
    try {
      await Kimlik.katkiGonder({ mekanId: o.mekan_id, il: o.il,
                                 mekanAd: o.mekan_ad, alan, deger });
      not.className = "im-not iyi";
      not.textContent = KATKI_ALAN[alan] + " güncellendi, sayfanda görünüyor.";
      girdi.value = "";
    } catch (e){
      not.className = "im-not kotu";
      not.textContent = e.message;
    }
    dug.disabled = false;
  });

  govde.querySelector("[data-birak]").addEventListener("click", async e => {
    if (!confirm("Bu işletmenin sahipliğini bırakıyorsun. Emin misin?")) return;
    e.target.disabled = true;
    try {
      await Kimlik.sahiplikBirak(Number(e.target.dataset.birak));
      uyar("iyi", "Sahiplik bırakıldı.");
      await ciz();
    } catch (x){ uyar("hata", x.message); e.target.disabled = false; }
  });

  return kap;
}

async function ciz(){
  const yuva = el("#liste");
  yuva.textContent = "Yükleniyor…";
  let liste = [];
  try { liste = await Kimlik.sahipliklerim(); }
  catch (e){ uyar("hata", "İşletmelerin yüklenemedi."); }

  const aktif = liste.filter(o => o.durum === "aktif").length;
  el("#ustyazi").textContent = liste.length
    ? (aktif ? sayi(aktif) + " doğrulanmış işletme" : "Doğrulanmış işletmen yok")
    : "Henüz bir işletme sahiplenmedin.";

  if (!liste.length){
    yuva.innerHTML =
      '<div class="im-bos">' +
      "<strong>Sahiplendiğin işletme yok</strong>" +
      "İşletmenin kapısına bıraktığımız kartta bir kod var. Aşağıya girersen " +
      "sayfa senin olur: eklediğin saat, telefon, adres ve site bilgisi " +
      "sıraya girmeden yayına çıkar." +
      "</div>";
    el("#kodKutu").hidden = false;
    return;
  }

  yuva.textContent = "";
  for (const o of liste) yuva.appendChild(await mekanKutusu(o));
  el("#kodKutu").hidden = false;
}

el("#kodForm").addEventListener("submit", async olay => {
  olay.preventDefault();
  const girdi = el("#kod"), not = el("#kodNot"), dug = el("#kodForm button");
  const kod = girdi.value.trim();
  if (!kod){ not.className = "im-not kotu"; not.textContent = "Kodu yaz."; return; }
  dug.disabled = true;
  try {
    const m = await Kimlik.sahiplikTalep(kod);
    not.className = "im-not iyi";
    not.textContent = (m && m.mekanAd ? m.mekanAd : "İşletme") + " hesabına bağlandı.";
    girdi.value = "";
    await ciz();
  } catch (e){
    not.className = "im-not kotu";
    not.textContent = e.message;
  }
  dug.disabled = false;
});

(async () => {
  let hazir = false;
  try { hazir = await Kimlik.hazir; } catch (e) { hazir = false; }
  if (!hazir || !Kimlik.girisli){
    /* Girişsiz kullanıcı buraya bakmamalı ama BOŞ EKRAN da görmemeli:
       nereye gideceğini söyleyen bir yere gönderiliyor. `replace`:
       geri tuşu kullanıcıyı bu boş sayfaya geri getirmesin. */
    location.replace("isletme-giris.html");
    return;
  }
  /* Girişte kod kullanıldıysa müjdeyi burada veriyoruz; kodun tutmadığı
     hal de aynı yerden bildiriliyor -- iki haber tek yerde. */
  try {
    const yeni = sessionStorage.getItem("cebimde.yeniSahiplik");
    const hata = sessionStorage.getItem("cebimde.kodHatasi");
    sessionStorage.removeItem("cebimde.yeniSahiplik");
    sessionStorage.removeItem("cebimde.kodHatasi");
    if (yeni) uyar("iyi", yeni + " hesabına bağlandı.");
    else if (hata) uyar("hata", hata);
  } catch (e) {}
  await ciz();
})();
