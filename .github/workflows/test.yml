# Butun kontrolleri her itmede kosturur.
#
# Neden gerekli: depoda 60'tan fazla calisir kontrol vardi ama hepsi elle
# calistiriliyordu -- betikler icin "python <betik>.py test", tarayici icin
# sayfayi "?test=1" ile acmak. Pratikte kimse acmiyor, yani kontroller
# yazildiklari gun disinda hicbir seyi korumuyordu.
name: Kontroller

on:
  push:
  pull_request:
  workflow_dispatch:

# Ayni dal icin ust uste itmelerde eskisini iptal et.
concurrency:
  group: kontroller-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Kazima betikleri bu paketleri MODUL DUZEYINDE import ediyor, o yuzden
      # saf mantik kontrolleri icin bile gerekiyorlar. playwright'in kendisi
      # kuruluyor ama TARAYICI INDIRILMIYOR (~300 MB): "test" kipi ag'a
      # cikmiyor, yalniz ayristirma ve suzme mantigini sinuyor.
      - name: Bagimliliklar
        run: pip install --quiet httpx pymupdf playwright

      - name: Kontroller
        run: python test.py

      # Depodaki veri, boru hattinin BUGUN uretecegi veriyle ayni olmali.
      # test.py ciktinin kendi ICINDE tutarli oldugunu dogruluyor; bu adim
      # ciktinin KAYNAKLA tutarli oldugunu dogruluyor. Ikisi ayri sey:
      # betigi degistirip veriyi yeniden uretmeyi unutmak, tam da bu
      # denetim sirasinda birkac kez oldu ve her seferinde sessiz kaldi.
      # Uc betik toplam ~2,5 saniye; ucuz bir kural.
      - name: Veri boru hattindan yeniden uretilebiliyor
        run: |
          python app_veri.py > /dev/null
          python fiyat_analiz.py > /dev/null
          python vitrin_uret.py > /dev/null
          if ! git diff --exit-code --stat; then
            echo "::error::Depodaki veri boru hattinin urettiginden farkli."
            echo "Duzeltmek icin: python app_veri.py && python fiyat_analiz.py && python vitrin_uret.py"
            exit 1
          fi
